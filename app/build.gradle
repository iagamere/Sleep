plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hares.focus'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hares.focus'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // مفتاح توقيع ثابت: ضروري كي تعمل التحديثات فوق النسخة المثبتة
    // (التطبيق محمي من الحذف، فلا يمكن "حذف ثم تثبيت" عند كل تحديث).
    signingConfigs {
        release {
            storeFile file('hares.keystore')
            storePassword 'hares-focus'
            keyAlias 'hares'
            keyPassword 'hares-focus'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
